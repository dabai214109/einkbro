name: Generate keystore (one-off)
on:
  workflow_dispatch:
    inputs:
      storepass:
        description: 'Keystore store/key password'
        required: true
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore sharkdock.keystore -alias sharkdock \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "${{ github.event.inputs.storepass }}" \
            -keypass "${{ github.event.inputs.storepass }}" \
            -dname "CN=SharkDock, OU=Personal, O=Personal, C=CN"
          base64 -w0 sharkdock.keystore > sharkdock.keystore.b64
      - name: Upload keystore
        uses: actions/upload-artifact@v7
        with:
          name: sharkdock-keystore
          path: |
            sharkdock.keystore
            sharkdock.keystore.b64
